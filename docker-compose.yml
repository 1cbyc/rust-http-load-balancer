version: '3.8'

services:
  # Production HTTPS Load Balancer
  load-balancer:
    build: .
    ports:
      - "443:443"
      - "9090:9090"
    volumes:
      - ./config.toml:/etc/load-balancer/config.toml:ro
      - ./certs:/etc/load-balancer/certs:ro
    environment:
      - RUST_LOG=info
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - load-balancer-network
    restart: unless-stopped

  # Sample backend services
  backend-1:
    image: nginx:alpine
    container_name: backend-1
    ports:
      - "8001:80"
    volumes:
      - ./backend-configs/backend-1.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - load-balancer-network
    restart: unless-stopped

  backend-2:
    image: nginx:alpine
    container_name: backend-2
    ports:
      - "8002:80"
    volumes:
      - ./backend-configs/backend-2.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - load-balancer-network
    restart: unless-stopped

  backend-3:
    image: nginx:alpine
    container_name: backend-3
    ports:
      - "8003:80"
    volumes:
      - ./backend-configs/backend-3.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - load-balancer-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - load-balancer-network
    restart: unless-stopped

  # Grafana for monitoring dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - load-balancer-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  load-balancer-network:
    driver: bridge 